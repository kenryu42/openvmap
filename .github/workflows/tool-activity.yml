# Every day, record each listed tool's license, archived flag, last commit on
# its default branch, stars and latest release from the GitHub API, and its
# OpenSSF Scorecard score (scripts/check-tools.ts), and commit data/tool-activity.json to main when it
# changed. A license that no longer matches data/tools.yaml fails the run, so
# a relicensed tool is not shown under its old license.
name: tool-activity
on:
  schedule:
    - cron: "41 21 * * *"
  workflow_dispatch:
permissions: {}
concurrency:
  group: tool-activity
  cancel-in-progress: false
jobs:
  update:
    if: github.repository == 'kenryu42/openvmap'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile

      - name: Record tool activity
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bun run check-tools

      - name: Validate, then commit and push
        env:
          GH_TOKEN: ${{ github.token }}
          GIT_AUTHOR_NAME: vmap tool activity
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: vmap tool activity
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          set -euo pipefail
          bun run validate-tools
          git add data/tool-activity.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -q -m "chore(data): tool activity $(date -u +%F)"
          remote="https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          git pull -q --rebase "$remote" main
          git push "$remote" HEAD:main
