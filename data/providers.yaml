    incidents:
      php2shell:
        status: "patched"
        confidence: official
        date: "2026-10-22"
        summary: "公式ブログ（10月21日〜23日更新）：Managed WordPressは10月21日19:30（UTC）、Windows Hostingは10月22日1:20、Web Hosting（cPanel）は10月22日13:30に、それぞれ「すべてのPHPバージョンにパッチを適用した」と報告。Web HostingはCloudLinuxのパッケージを使うため、修正済みでもバージョン番号が変わらない場合があり、ビルド日が2026年10月21日以降かで確認するよう案内している。VPSは利用者がPHPを管理する。10月23日には別の未修正の脆弱性CVE-2026-115560が公表されたとして、VPSではsession.upload_progress.enabledを0にするよう案内。記事の掲載日表示は10月20日で、本文の日付と食い違う。"
        summary_en: "Official blog (updated Oct 21-23): GoDaddy reports it 'patched all PHP versions' on Managed WordPress at 19:30 UTC on Oct 21, on Windows Hosting at 01:20 on Oct 22 and on Web Hosting (cPanel) at 13:30 on Oct 22. Web Hosting uses CloudLinux packages, so a patched build may keep its old version number; the post says to check for a build date of Oct 21 2026 or later. VPS customers run PHP themselves. On Oct 23 it noted a separate, still unpatched CVE-2026-115560 and told VPS users to set session.upload_progress.enabled to 0. The post's header date (Oct 20) does not match its contents."
        customer_action: "Managed WordPress・Windows Hosting・Web Hostingでは対応不要。Web HostingではphpinfoのBuild Dateが2026年10月21日以降か確認する。PHP 8.1以前は開発元の修正がないため、8.2以降への切替を推奨されている。VPS利用者は自分でPHPを修正版へ更新し、PHPとWebサーバーを再起動して、session.upload_progress.enabledを0にする。"
        customer_action_en: "No action on Managed WordPress, Windows Hosting or Web Hosting. On Web Hosting, check that phpinfo's build date is Oct 21 2026 or later. PHP 8.1 and older get no upstream fix; GoDaddy recommends 8.2 or later. VPS customers must update PHP to a fixed release, restart PHP and the web server, and set session.upload_progress.enabled to 0."
        source: https://www.godaddy.com/resources/news/important-php-security-update-what-website-owners-need-to-do
        verified_at: "2026-10-26"

