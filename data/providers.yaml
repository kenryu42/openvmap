    http_headers: ["x-vercel-id"]
    #   x-vercel-id: curl -sI https://nextjs.org/ and https://vercel.com/ return x-vercel-id with server: Vercel (2026-10-24)
    notes: "Most Vercel sites do not use PHP. Where PHP functions are used, the customer controls the PHP version."
    notes_ja: "Vercel 上のサイトの多くはPHPを使わない。PHP関数を使う場合、PHPのバージョンは利用者が管理する。"
    news: https://vercel.com/kb/bulletin
    #   Checked 2026-10-26: lists both cited bulletins.
    incidents:
      php2shell:
        status: "n/a"
        confidence: official
        summary: "Vercel の公式セキュリティ告知：公表前から既知の攻撃パターンを遮断するWAFルールを全プロジェクトに無償で自動適用し、Vercel 上のPHP関数と、Vercel が中継する外部PHPバックエンドへの通信を対象とした。Vercel が自社のPHPランタイムを更新したとの記載はなく、WAFは修正の代わりにならないとして、利用者にPHPランタイムの即時更新を求めている。告知に日付の記載はない。"
        summary_en: "Vercel bulletin: WAF rules blocking known exploit patterns were deployed before disclosure and apply automatically, at no cost, to all projects, covering PHP functions on Vercel and requests proxied to external PHP backends. It does not say Vercel patched any PHP runtime. It tells customers to upgrade their PHP runtime immediately, since WAF rules do not replace patching. The bulletin carries no date."
        customer_action: "Next.js など静的・JavaScriptのみのサイトはPHPの作業不要。Vercel でPHP関数を使っている場合や、Vercel 経由で外部のPHPサーバーを公開している場合は、PHPを 8.2.35 / 8.3.36 / 8.4.27 / 8.5.12 以降に更新して再デプロイし、外部サーバーへの直接アクセスを制限する。"
        customer_action_en: "Static or JavaScript-only sites (e.g. Next.js) need no PHP work. If you use PHP functions on Vercel or proxy to an external PHP backend through Vercel, update PHP to 8.2.35 / 8.3.36 / 8.4.27 / 8.5.12 or later, redeploy, and restrict direct access to the backend."
        source: https://vercel.com/kb/bulletin/php2shell-security-bulletin
        verified_at: "2026-10-24"
      vercel-2026-04:
        title: "2026年4月のセキュリティ事故（環境変数の漏えい）"
        title_en: "April 2026 security incident (environment variables exposed)"
        status: "patched"
        confidence: official
        date: "2026-10-16"
        summary: "公式告知：外部のAIツール経由で従業員のアカウントが乗っ取られ、攻撃者がVercelの内部システムに入り、一部の顧客の「sensitive」指定でない環境変数を列挙・復号した。対象の顧客には通知済み。Vercelは10月16日に対応がすべて完了し、事故を終結したと発表した。"
        summary_en: "Official bulletin: an employee's account was taken over through a third-party AI tool, and the attacker reached internal Vercel systems and enumerated and decrypted some customers' environment variables not marked sensitive. Affected customers were notified. On Oct 16 Vercel announced remediation complete and the incident closed."
        customer_action: "Vercelから通知を受けた場合や未対応の場合は、sensitive指定でない環境変数（APIキー、トークン、データベースの認証情報、署名鍵）を入れ替え、秘密の値はsensitiveに指定する。MFAを有効にし、アクティビティログと身に覚えのないデプロイを確認する。"
        customer_action_en: "If Vercel notified you, or you have not acted yet, rotate environment variables not marked sensitive (API keys, tokens, database credentials, signing keys) and mark secrets as sensitive. Turn on MFA and review activity logs and unexpected deployments."
        source: https://vercel.com/kb/bulletin/vercel-april-2026-security-incident
        verified_at: "2026-10-24"

