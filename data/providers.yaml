# Provider table for OpenVMap.
#
# One entry per hosting, site-platform, cloud, CDN, DNS or mail provider,
# with how to recognise it from public DNS and BGP data, and its published
# response to the current incident.
#
# License: CC BY 4.0 (see data/LICENSE). The code is MIT (see LICENSE).
#
# Rules for contributors (checked by `bun run validate-providers`):
#   - "confidence: official" only with a link to the provider's own page,
#     read by whoever sets it.
#   - "confidence: secondary" for press or third-party summaries. Say so in
#     the summary and link the summary you used.
#   - Never guess an ASN or a suffix. Each identifier needs either the
#     vendor's own page that documents it or a dig / Team Cymru observation;
#     record which in the comment under it. A missing identifier causes a
#     missed match; a wrong one causes a wrong vendor.
#   - No suffix under two providers. Services of one operator that share a
#     network may each list its ASN, the operator first; every later one
#     needs a name-server or CNAME suffix, which decides between them.
#     Where the name servers also serve another service on that network,
#     give ptr_suffixes (the reverse DNS names of the service's servers)
#     instead: the check then asks for the address's reverse name, and only
#     that name picks the service.
#   - Write summaries on one line: a line break inside Japanese text shows
#     up as a stray space.
#   - verified_at is the date you last read the source, not the source's date.
#   - news is the provider's own list of notices (or its feed), opened and
#     seen to list its notices. check-sources reports new posts on it whose
#     title mentions PHP, a vulnerability, security, an emergency or a pause.
#
# incident is the incident the site features; incident_cves are shown next to
# its name, and content/guide/<incident>/ holds its guide.
#
# Status values: patched | in_progress | unknown | conflicting | n/a
# Kinds: hosting (runs PHP for the customer) | saas (runs the whole site on
#        its own platform) | paas (runs the customer's containers; the
#        customer runs PHP) | cloud (customer runs PHP) | cdn | dns | mail
# n/a is for kinds that run no PHP for the customer: saas, paas, cloud, cdn, dns, mail.

incident: php2shell
incident_cves: [CVE-2026-109618, CVE-2026-109619]
updated_at: "2026-10-29"

providers:

  # ---- Japanese shared / managed hosting. Where several services share one operator's network, the operator is listed first: it is the default when no name server or CNAME says which service it is.

  - id: xserver
    name: "Xserver"
    name_ja: "エックスサーバー"
    kind: hosting
    asns: [131965]
    #   131965: dig +short TXT AS131965.asn.cymru.com -> "131965 | JP | apnic | 2011-08-04 | XSERVER - Xserver Inc., JP"; serv…
    as_name_contains: ["XSERVER"]
    #   XSERVER: dig +short TXT AS131965.asn.cymru.com -> "... XSERVER - Xserver Inc., JP"
    ns_suffixes: ["xserver.jp", "xtwo.ne.jp"]
    #   xserver.jp: https://www.xserver.ne.jp/manual/man_domain_namesever_setting.php
    #   xtwo.ne.jp: Same manual page lists ns1/ns2/ns3.xtwo.ne.jp for accounts from the 2019 X2 integration; dig +short A ns1.xtwo…
    notes: "Operated by Xserver Inc. Star Rental Server, Shin Rental Server and wpX Speed run in the same network (AS131965). Star customers are recognised by their name servers; Shin Rental Server and wpX Speed share their name servers (ns1-3.wpx.ne.jp), cannot be told apart, and show as Xserver."
    notes_ja: "エックスサーバー株式会社の運営。スターレンタルサーバー・シン・レンタルサーバー・wpX Speed も同じネットワーク（AS131965）で動いている。スターはネームサーバーで判別できるが、シン・レンタルサーバーと wpX Speed はネームサーバー（ns1〜3.wpx.ne.jp）も共通で区別できないため、エックスサーバーと表示される。"
    news: https://www.xserver.ne.jp/support/news.php
    #   Checked 2026-10-26: lists the cited notice.
    incidents:
      php2shell:
        status: "patched"
        confidence: official
        date: "2026-10-26"
        summary: "公式発表（10月21日付、26日の完了まで記載）：エックスサーバー・XServerビジネス・XServer for WordPressでは、10月21日12:00までに修正版公開前の緩和策を実施し、同日23:00頃の修正版公開後はPHP 8.2〜8.5から順次修正を適用、公式サポート終了済みの旧バージョンにも対応を広げ、10月26日6:20までにPHP 5.1〜8.5のすべての対象サーバーへの対応を完了。8.2〜8.5は同じ系列の修正版に更新、5.1〜8.1はバージョンを変えずに修正パッチを適用しているため、表示上のバージョンが古く見えても正常。このお知らせにはバージョンごとの完了時刻の記載はない。XServer VPS系は利用者がPHPを管理するため事業者はパッチを適用していない。"
        summary_en: "Official notice (dated Oct 21, covering completion on Oct 26): on Xserver, XServer Business and XServer for WordPress, mitigations were in place by 12:00 on Oct 21; after the fixed releases came out around 23:00 that day, fixes were rolled out starting with PHP 8.2-8.5 and extended to older end-of-life versions, reaching all target servers for PHP 5.1-8.5 by 06:20 on Oct 26. 8.2-8.5 were moved to fixed releases of the same branch; 5.1-8.1 were patched without changing the version, so an older-looking version number is expected. This notice gives no per-version completion times. XServer VPS products are not patched by Xserver; customers manage PHP there."
        customer_action: "今回の対策のために急いでPHPバージョンを変える必要はない（5.1〜8.5のすべてが対策済み）。利用状況により追加の対策を改めて案内する場合があるとされる。PHP 8.1以前は公式サポートが終了しているため、バックアップと動作確認のうえサポート対象のPHPへの切替を検討。XServer VPSの利用者は自分でPHPのバージョンを確認し修正版へ更新する。"
        customer_action_en: "No urgent PHP version change is needed for this fix (5.1-8.5 are all patched). The vendor may announce extra steps depending on usage. PHP 8.1 and older are out of upstream support, so plan a move to a supported PHP after a backup and test. XServer VPS customers must check and update PHP themselves."
        source: https://www.xserver.ne.jp/news_detail.php?view_id=19756
        verified_at: "2026-10-26"

