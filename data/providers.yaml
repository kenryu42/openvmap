        summary: "Google Cloud セキュリティ速報 GCP-2026-070（2026年10月21日公開）によると、Google Cloud 自体は脆弱ではないが、Google Cloud 上で PHP 5.4〜8.5 を動かしているワークロードは影響を受けうる。修正版は 8.5.12・8.4.27・8.3.36・8.2.35。App Engine スタンダード、Cloud Run、自動更新を有効にした Cloud Run functions では自動的に最新PHPへ更新される場合がある。それ以外は利用者が更新済みの依存関係で再デプロイする。10月24日の GCP-2026-072 では、Apigee への影響は利用者が自ら運用する Drupal ベースの Apigee デベロッパーポータルに限られ、他の Apigee 製品は PHP を使っておらず影響を受けないとしている。"
        summary_en: "Google Cloud bulletin GCP-2026-070 (published 2026-10-21): Google Cloud itself is not vulnerable, but customer workloads running PHP 5.4-8.5 may be. Fixed in 8.5.12, 8.4.27, 8.3.36 and 8.2.35. Workloads on App Engine standard, Cloud Run, and Cloud Run functions with automatic updates may be patched automatically; others must be redeployed with updated dependencies. Bulletin GCP-2026-072 (Oct 24) adds that on Apigee only the Drupal-based developer portals, which customers deploy and operate, are affected; other Apigee products do not use PHP."
        customer_action: "Compute Engine などでPHPを動かしている場合は、サーバー管理者にPHPを修正版へ更新して再デプロイするよう依頼。App Engine スタンダードや Cloud Run でも、実際に修正版で動いているか確認。Drupal ベースの Apigee デベロッパーポータルを運用している場合は、そのPHPも更新する。"
        customer_action_en: "If PHP runs on Compute Engine or similar, ask your administrator to update PHP to a fixed release and redeploy. On App Engine standard or Cloud Run, confirm the running version is a fixed one. If you run a Drupal-based Apigee developer portal, update its PHP too."
