    notes_ja: "ZeaburはAWSやGCPのアドレスで動くため、ネットワークではなくCNAMEか応答ヘッダで判別する。ルートドメインのAレコードでクラスターのアドレスを直接指している場合はAWSと表示される。Zeaburはサービスを終了し、2026年12月31日までに共有クラスターと専用サーバーをすべて停止する。"
    news: https://zeabur.com/ja-JP/blogs
    #   Checked 2026-10-26: lists the cited report.
