      php2shell:
        status: "n/a"
        confidence: secondary
        summary: "PaaS。PHPは利用者のサービスで動き、利用者が更新する。php2shellについての告知は見当たらない（2026年10月24日時点）。"
        summary_en: "PaaS. PHP runs in the customer's service and the customer updates it. No php2shell notice found (as of 2026-10-24)."
        customer_action: "PHPを使うサービスは修正版のPHPに更新して再デプロイする。サービス終了に向けた移行先でも同様に確認する。"
        customer_action_en: "For services that use PHP, update to a fixed PHP release and redeploy; check the same on whatever you migrate to."
        verified_at: "2026-10-24"
      zeabur-2026-10:
        title: "2026年10月のセキュリティ事故（環境変数の漏えい）とサービス終了"
        title_en: "October 2026 security incident (environment variables exposed) and shutdown"
        status: "in_progress"
        confidence: official
        date: "2026-10-19"
        summary: "公式の暫定報告（10月19日、日本語版あり）：10月14〜15日（UTC）、漏えいしていた内部の認証情報を使って攻撃者が共有クラスター・GCP専用サーバー・内部システムに侵入し、共有クラスターのサービス設定と環境変数、Zeaburのデータベースに保存された環境変数を読み取った。8月にも別の事故があり、そのときの鍵の入れ替えは今回使われた認証情報を含んでいなかった。原因はZeabur側にある（長期間有効な管理者認証情報の平文保存）。Zeaburは10月17日にサービス終了を発表し、12月1日から共有クラスターのサービスを一時停止、12月31日までにすべての共有クラスターと専用サーバーを終了する。調査は継続中。"
        summary_en: "Official preliminary report (Oct 19, also in Japanese): on Oct 14-15 UTC an attacker used leaked internal credentials to enter the shared cluster, GCP dedicated servers and internal systems, and read service settings and environment variables on the shared cluster as well as the environment variables stored in Zeabur's database. A separate incident happened in August, and the credential rotation then did not cover the ones used this time. Zeabur says the root cause is its own (long-lived admin credentials stored in plaintext). On Oct 17 Zeabur announced it is shutting down: shared-cluster services are paused from Dec 1, and all shared clusters and dedicated servers end by Dec 31. The investigation continues."
        customer_action: "Zeaburに保存したすべてのパスワードと鍵（APIキー、クラウドの鍵、データベースのパスワード、署名・暗号鍵）を、8月に入れ替えたものも含めて提供元で失効させ、新しい値に替えて再デプロイする。共有クラスターのデータベースは中のパスワードも変更する。アクセストークンを作り直し、GitHubの監査ログと10月14日以降（GCP専用サーバーは9月1日以降）の請求を確認する。12月1日までにバックアップと移行を済ませる。"
        customer_action_en: "Revoke every password and key stored on Zeabur (API keys, cloud keys, database passwords, signing and encryption keys), including ones already replaced in August, then set new values and redeploy. On the shared cluster, also change the passwords inside your databases. Recreate access tokens, check the GitHub audit log and bills from Oct 14 (Sept 1 for GCP dedicated servers). Back up and migrate before Dec 1."
        source: https://zeabur.com/ja-JP/blogs/october-2026-security-incident
        verified_at: "2026-10-24"

