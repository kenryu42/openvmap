      php2shell:
        status: "patched"
        confidence: official
        date: "2026-10-23"
        summary: "公式発表（2026年10月21日掲載、23日最終更新）によると、10月21日22時から緊急メンテナンスでWebサーバーを止めてPHPを更新した。PHP 7.4・8.1・8.2・8.3・8.4・8.5 のサーバーは作業を終え、10月22日8時にWebを再開した。公式修正版のない7.4と8.1には修正パッチを当てたため、バージョン番号を見ても修正済みかどうかは分からない。他のバージョンはマイナーバージョンアップ。PHP 5.3 は最新版へ強制的にバージョンアップし（5.3には戻せない）、完了予定を10月22日19時に変更したが、完了の報告は本文にない。"
        summary_en: "Official notice (posted 2026-10-21, last updated 2026-10-23): emergency maintenance from 22:00 on Oct 21 stopped the web servers to update PHP. Servers on PHP 7.4, 8.1, 8.2, 8.3, 8.4 and 8.5 were finished and back online at 08:00 on Oct 22. 7.4 and 8.1 have no official fixed release, so Zenlogic applied fix patches to them; their version string does not show whether the fix is in. Other versions got a minor version upgrade. PHP 5.3 was force-upgraded to the latest version, with no way back. Its target finish was moved to 19:00 on Oct 22, and the page body does not confirm that it finished."
        customer_action: "PHP 5.3 で動いていたサイトは、フォームやCMSの表示・動作を確認し、必要ならプログラムを直す。7.4・8.1 は修正パッチ済みでもバージョン番号では判別できないため、サポート中の8.3以降への移行を検討する。"
        customer_action_en: "Sites that ran on PHP 5.3 should check that forms and the CMS still work, and fix the code where needed. On 7.4 or 8.1 the fix cannot be confirmed from the version number, so plan a move to 8.3 or later."
        source: https://www.idcf.jp/rentalserver/maintenance/2026/20261021-2.html
        verified_at: "2026-10-24"

