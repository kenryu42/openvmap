  # ---- Hosting on a cloud's network: listed after that cloud, so an address alone shows the cloud and the host's name servers pick the host.

  - id: siteground
    name: "SiteGround"
    name_ja: "SiteGround"
    kind: hosting
    asns: [15169, 396982]
    #   15169, 396982: shared with google-cloud, listed after it. phyllistsoi.com and fishbugz.com (NS ns1/ns2.siteground.net) -> 35.213.197.246 / 35.213.212.197, Cymru origins 15169 and 19527 (35.213.192.0/18); idigitalprint.com -> 34.174.223.175, origin "396982 | 34.174.128.0/17" (2026-10-26)
    ns_suffixes: ["siteground.net"]
    #   siteground.net: https://www.siteground.com/kb/point-domain-siteground ("ns1.siteground.net", "ns2.siteground.net"); dig +short NS phyllistsoi.com / fishbugz.com / idigitalprint.com -> ns1/ns2.siteground.net, web addresses in Google Cloud (35.213.197.246, 35.213.212.197, 34.174.223.175) (2026-10-26)
    notes: "SiteGround's servers run on Google Cloud (observed origins AS15169, AS19527, AS43515, AS396982). It is listed after google-cloud with Google's two cloud ASNs, so the name servers (ns1/ns2.siteground.net) identify SiteGround; a site that only points an A record to SiteGround shows as Google Cloud, and one in AS19527 or AS43515 as unmatched."
    notes_ja: "SiteGroundのサーバーはGoogle Cloud上にある（確認したAS：15169、19527、43515、396982）。google-cloudの後にGoogleの2つのASとともに載せており、ネームサーバー（ns1／ns2.siteground.net）でSiteGroundと判別する。Aレコードだけを向けたサイトはGoogle Cloud、AS19527・AS43515のアドレスは一覧外と表示される。"
    news: https://www.siteground.com/blog/
    #   Checked 2026-10-26: lists the cited post among product posts; /blog/feed/ returns 404.
    incidents:
      php2shell:
        status: "patched"
        confidence: official
        date: "2026-10-21"
        summary: "公式ブログ（10月21日、22日12:00 UTC更新）：修正版の公開前に全サーバーへサーバー側の緩和ルールを入れ、提供中の全PHPバージョンで該当機能を無効化した。10月21日に修正版が公開されると「SiteGroundの全サーバーに適用した」とし、利用者の作業は不要としている。スタッフのコメント（10月22日・23日）では、Managed PHPか手動選択かにかかわらず、PHP 7.4を含むSite Toolsの全バージョンが保護されているとするが、7.4〜8.1については「サーバー側の緩和策」と書いており、コードの修正が入ったかどうかは書かれていない。"
        summary_en: "Official blog (Oct 21, updated 12:00 UTC Oct 22): before the release SiteGround deployed server-level mitigation rules on all servers and disabled the affected functionality on all supported PHP versions; once PHP released the fixes on Oct 21 it 'applied them across all SiteGround servers' and says customers need do nothing. Staff comments (Oct 22-23) say every PHP version in Site Tools, including 7.4, is covered whether Managed PHP or manually selected, but describe 7.4-8.1 as covered by 'server-level security mitigations'; they do not say a code fix was applied to those."
        customer_action: "今回の対策のための作業は不要とされる。PHP 8.1以前（7.4など）を手動で選んでいる場合は、開発元の修正がないため、Site ToolsでManaged PHPか8.2以降へ切り替えることを検討。"
        customer_action_en: "SiteGround says no action is needed. Sites manually pinned to PHP 8.1 or older (e.g. 7.4) have no upstream fix, so consider switching to Managed PHP or 8.2+ in Site Tools."
        source: https://www.siteground.com/blog/critical-php-vulnerabilities-october-2026
        verified_at: "2026-10-26"

