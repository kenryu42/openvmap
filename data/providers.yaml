  - id: lolipop
    name: "Lolipop (GMO Pepabo)"
    name_ja: "ロリポップ！（GMOペパボ）"
    kind: hosting
    asns: [7506]
    #   7506: shared with gmo-internet. dig +short A ftp.lolipop.jp -> 157.7.104.66, ssh.lolipop.jp -> 157.7.106.21; Team Cymru origin for both -> "7506 | 157.7.96.0/20 | JP | apnic" (2026-10-26)
