      php2shell:
        status: "patched"
        confidence: official
        date: "2026-10-23"
        summary: "公式発表（10月23日17:30追記）：本脆弱性対応の緊急メンテナンスはすべて終了。さくらのレンタルサーバ・マネージドサーバでは、コントロールパネルで選択できる全てのPHPバージョン（サポート情報の告知によれば8.3/8.2/8.1/8.0/7.4/5.6/5.4/5.3/5.2）に対応済みで、提供中のサポート終了版にも必要な修正を適用。バージョン表記が変わるかどうかは記載がない。さくらのVPSはサービス提供部分でPHPを使っていないため影響なしとされ、VPS上で自らPHPを使う場合は最新版への更新を案内。さくらのクラウドは必要な対応を完了したが、一部機能の提供を停止中。"
        summary_en: "Official (addendum Oct 23 17:30): all emergency maintenance for this vulnerability has ended. Rental server and managed server: every PHP version selectable in the control panel (8.3/8.2/8.1/8.0/7.4/5.6/5.4/5.3/5.2 per the support notice) is fixed, including the EOL versions still offered. The notices do not say whether the version string changes. Sakura VPS does not use PHP in the service itself; customers running PHP on a VPS are told to update. Sakura Cloud: required work done, some features still suspended."
        customer_action: "レンタルサーバ利用者に緊急の作業はなし。サポート終了版は今後新たな脆弱性が見つかるおそれがあるため、サポート期間中の最新版PHPへの移行を推奨。VPSやクラウドで自分でPHPを動かしている場合は自分で修正版へ更新する。"
        customer_action_en: "Rental server customers: no urgent action. Because EOL PHP may have new flaws later, Sakura recommends moving to a supported PHP. If you run PHP yourself on VPS or cloud, update it yourself."
        source: https://www.sakura.ad.jp/corporate/information/announcements/2026/10/22/1968226117/
