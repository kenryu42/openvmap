  # ---- Certificate authorities: recognised from the organization (O) of the CA that issued the site's TLS certificate, read in one TLS 1.2 handshake.

  - id: emudhra
    name: "eMudhra (emSign)"
    name_ja: "eMudhra（emSign）"
    kind: ca
    cert_issuers: ["eMudhra"]
    #   eMudhra: issuer of www.cca.gov.in's certificate is "CN=EM DV TLS CA - G2A-1, O=eMudhra Technologies Limited" (openssl s_client, 2026-10-24); the compromised intermediates are "O=eMudhra BV" and "O=eMudhra Inc" (https://emudhra.we-have-a-problem.com/impacted-intermediates.json)
    distrusted_roots: ["emSign ECC Root CA - G3"]
    #   emSign ECC Root CA - G3: removed from NSS (Firefox) on 2026-10-20, https://bugzilla.mozilla.org/show_bug.cgi?id=2084101
    notes: "Indian certificate authority. Its emSign G1 roots are still trusted; emSign ECC Root CA - G3 has been removed from Firefox. eMudhra's statement says G1-root certificates remain fully supported; the press (The Register, Oct 22) reports that it is leaving the public TLS certificate business."
    notes_ja: "インドの認証局。emSign の G1 ルートは引き続き信頼されているが、emSign ECC Root CA - G3 は Firefox から削除された。eMudhra の声明では G1 ルートの証明書は引き続きサポートされるとしている。報道（The Register、10月22日）では公開サーバー証明書の事業から撤退すると伝えられている。"
    incidents:
      emudhra-2026-10:
        title: "2026年10月の中間CA秘密鍵の問題（CVE-2026-111943）"
        title_en: "October 2026 intermediate CA key compromise (CVE-2026-111943)"
        status: "in_progress"
        confidence: official
        date: "2026-10-28"
        summary: "公式声明（10月20日公開、28日更新、調査継続中）：2025年4月30日に作成した中間CA 8つの秘密鍵に問題があり（10月17日に外部の研究者が報告）、悪用されれば任意のドメインの証明書を発行できた。eMudhraは10月18日に8つすべてを失効させた。8つのうち7つは本番で使われておらず、使われた1つもサイト向けの証明書を発行していないとしている。ブラウザ各社が対象を遮断し、Mozillaは10月20日にこれらの上位の emSign ECC Root CA - G3 を削除した。影響はこのルートにつながる証明書に限られ（米国の1顧客グループ）、G1 ルートの証明書は引き続き有効で、eSignature などの利用者は対応不要としている。希望者には Sectigo 発行の証明書も提供する。10月26日の謝罪声明では、原因はスクリプトの誤りで弱い鍵のCAを発行したことだと認め、問題の確認から14時間以内に失効させたこと、インフラや顧客データの侵害はないことを説明し、影響を受けたG3の顧客と影響のないTLSの顧客を無償で別の証明書へ移行中とした。CCADBを通じて原因分析を公表し、外部の専門家による検証も依頼するとしている。10月28日の更新（Update 6）では、影響を受けたG3の階層で発行された約30,800枚の証明書は米国の1顧客グループのもので、この顧客はすでにG1 RSAルートからの代替発行を使っているとした。公開TLS証明書事業を自主的に縮小しており、この顧客の移行が終わればG1からのTLS証明書の発行も停止する。ほかのTLS顧客の大半はすでに別の事業者へ無償で移行済みで、残りも数日中に移行させる予定。電子署名（DSC・eSign）やemSigner、CertiNext、SecurePass、PrivaTrustには影響がないとしている。"
        summary_en: "Official statement (published Oct 20, updated Oct 28, investigation ongoing): the private keys of eight intermediate CAs created on 2025-04-30 were flawed (reported by an outside researcher on Oct 17); misused, they could issue certificates for any domain. eMudhra revoked all eight on Oct 18. Seven were never used in production and the one that was issued no site certificates, it says. Browsers blocked them, and Mozilla removed their root, emSign ECC Root CA - G3, on Oct 20. Impact is limited to certificates chaining to that root (one customer group in the US); G1-root certificates remain valid and eSignature and similar customers need do nothing. Sectigo-issued certificates are offered as an alternative. In a public apology on Oct 26 it said a script error issued the CAs with weak keys, that they were revoked within 14 hours of confirming the issue, and that its infrastructure and customer data were not compromised; it is moving affected G3 customers and its other TLS customers to alternate certificates at no cost. It will publish a root-cause analysis through CCADB and has commissioned an independent review. Its Oct 28 update (Update 6) says the roughly 30,800 certificates issued under the affected G3 hierarchies belong to one client ecosystem in the US, which is already using an alternate issuance pathway through eMudhra's G1 RSA root. As part of a voluntary wind-down of publicly trusted TLS services, eMudhra will stop issuing TLS certificates from G1 once that client's transition is complete. A vast majority of its other TLS customers have already been moved to alternate providers at no cost, and it intends to finish the rest in the coming days. Its digital signature (DSC, eSign) business and emSigner, CertiNext, SecurePass and PrivaTrust are unaffected, it says."
        customer_action: "証明書が emSign ECC Root CA - G3 につながっている場合は、すでに Firefox などでエラーになるため、至急別の認証局の証明書に入れ替える。eMudhra は公開TLS証明書の事業を縮小し、G1 からの発行も移行完了後に停止するとしているため、G1 ルートの証明書を使っている場合も、eMudhra が案内する無償の移行を受けるか、別の認証局（Let's Encrypt やホスティング事業者の無料証明書など）へ切り替える。サーバーから外部へ HTTPS 接続する場合（PHP の cURL など）は、OS の ca-certificates を更新する。"
        customer_action_en: "If the certificate chains to emSign ECC Root CA - G3, it already fails in Firefox and others: replace it with one from another CA now. eMudhra is winding down its publicly trusted TLS business and will stop issuing from G1 once its transition is complete, so if you use a G1-root certificate, take eMudhra's free migration to an alternate provider or move to another CA (Let's Encrypt, or your host's free certificate). If your server makes outbound HTTPS calls (PHP's cURL, for example), update the OS ca-certificates package."
        source: https://emudhra.com/en/post/certificate-security-incident
        verified_at: "2026-10-29"

