        date: "2026-10-28"
        summary: "公式発表（10月28日18時30分更新）：SV-Basic、ビジネス スタンダード、CHM-11Z〜13Z、CHM-21Z〜23ZではPHP 8.2.35・8.3.36・8.4.27の修正版を10月22日に適用済み。ACE01（2015年9月〜2019年9月契約）には10月27日にパッチ適用版の7.4.34と8.0.30を適用済み。SV-Basic・ビジネス スタンダード（2022年9月〜2025年12月契約）・CHM-11Z〜23Zの7.4.xは10月29日に適用予定。それ以外の旧バージョンや旧プラン（G、X、Z、ZZ、2015年9月以前契約のACE01、Pro、V、MG、CHM、CHM-S、CHM-Zなど）は今回のパッチの提供対象外で、php.iniでの緩和策を案内。10月28日の追記で、ZZ、ACE01（2011年10月〜2015年9月契約）、CHM01〜03、CHM-01S〜03S、CHM-01Z〜03Z、MG01〜05の全PHPバージョンについて、CPI側でphp.iniのデフォルト値を変更する緩和策を実施したとしたが、利用者が設置したphp.iniがあればその設定が優先される。G、X、Z、Pro、Vシリーズなどは対象に含まれていない。再開したコントロールパネルのPHPバージョン表示は最新ではなく、後日更新予定。利用者のサーバー自体は停止しておらず、不正アクセスは確認されていない。"
        summary_en: "Official (updated Oct 28 18:30): SV-Basic, Business Standard and CHM-11Z to 23Z got the fixed releases 8.2.35, 8.3.36 and 8.4.27 on Oct 22. ACE01 (contracts Sep 2015 to Sep 2019) got patched 7.4.34 and 8.0.30 on Oct 27. A patched 7.4.x is scheduled for Oct 29 on SV-Basic, Business Standard (contracts Sep 2022 to Dec 2025) and CHM-11Z to 23Z. Other old versions and legacy plans (G, X, Z, ZZ, ACE01 before Sep 2015, Pro, V, MG, CHM, CHM-S, CHM-Z etc.) get no patch; customers are told to apply php.ini mitigations. An Oct 28 addendum says CPI itself changed the php.ini defaults as a mitigation for every PHP version on ZZ, ACE01 (contracts Oct 2011 to Sep 2015), CHM01-03, CHM-01S-03S, CHM-01Z-03Z and MG01-05, but a php.ini placed by the customer takes precedence; the G, X, Z, Pro and V series are not listed. The resumed control panel still shows the old version number and will be updated later. Customer servers were not stopped; no unauthorized access confirmed."
        customer_action: "コントロールパネルで利用中のプランとPHPバージョンを確認。7.4・8.0を使っていてパッチ適用版の提供予定があるプランは、提供後に切替える（メジャー・マイナーバージョンが変わる場合は.htaccessの変更が必要）。それまでの間や提供対象外のバージョンでは、修正済みバージョン（8.2.35／8.3.36／8.4.27）へ切替えるか、公式案内のphp.ini設定（session.upload_progress.enabled = Off など）を適用。CPIがphp.iniのデフォルト値を変更したプラン（ZZ、旧ACE01、CHM、CHM-S、CHM-Z、MG）でも、自分でphp.iniを設置している場合はその内容が優先されるため、設定値を確認する。php.iniの変更はCPIのサポート対象外。パネルの表示が古くても修正版は適用済みの場合がある。"
        customer_action_en: "Check your plan and PHP version. If you run 7.4 or 8.0 on a plan with a patched build scheduled, switch to it once released (a .htaccess change is needed if the major or minor version changes). Until then, and on versions with no patch, switch to a patched version (8.2.35/8.3.36/8.4.27) where available, or apply the php.ini settings in the notice (e.g. session.upload_progress.enabled = Off). On the plans where CPI changed the php.ini defaults (ZZ, older ACE01, CHM, CHM-S, CHM-Z, MG), a php.ini you placed yourself overrides them, so check its values. CPI does not support php.ini changes. The panel may show an old version even where the fix is applied."
        source: https://www.cpi.ad.jp/news/support-info/261022/
        verified_at: "2026-10-29"

