    notes_ja: "Hostingerのネームサーバー（*.dns-parking.com）は、利用者がPHPを管理するVPSや、Hostingerで登録したドメインでも使われるため、ネームサーバーだけではマネージドのホスティングとは言い切れない。一部のアドレス（213.210.57.0/24）はAS8851（GCI）の経路にも含まれ、ASがGCIと表示される場合がある。その場合はCNAME（cdn.hstgr.net）でHostingerと分かり、Aレコードだけのホストは一覧外のGCIのネットワークと表示される。"
