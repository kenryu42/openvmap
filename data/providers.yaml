    name: "Zeabur"
    name_ja: "Zeabur"
    kind: paas
    cname_suffixes: ["zeabur.app", "clusters.zeabur.com"]
    #   zeabur.app: https://zeabur.com/docs/en-US/deploy/domain-binding ("a domain name with the zeabur.app suffix, such as your-service.zeabur.app")
