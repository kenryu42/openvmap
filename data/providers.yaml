    as_name_contains: ["HOSTINGER"]
    #   HOSTINGER: dig +short TXT AS47583.asn.cymru.com -> "... AS-HOSTINGER - Hostinger International Limited, CY"
    ns_suffixes: ["dns-parking.com"]
