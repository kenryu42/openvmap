  - id: railway
    name: "Railway"
    name_ja: "Railway"
    kind: paas
    asns: [400940]
    #   400940: dig +short A docs.railway.com -> 69.46.46.46 (CNAME 0fh30wh0.up.railway.app); Cymru 2026-10-24 -> "400940 | 69.46.46.0/24 | US | arin"; AS name "RAILWAY - Railway, US". No as_name_contains: "RAILWAY" would also match rail operators' networks.
    cname_suffixes: ["railway.app"]
    #   railway.app: https://docs.railway.com/networking/domains/working-with-domains ("a CNAME record (e.g., g05ns7.up.railway.app)"; "Auto-generated *.up.railway.app domains")
    http_headers: ["x-railway-request-id", "x-railway-edge"]
    #   x-railway-request-id, x-railway-edge: curl -sI https://blog.railway.com/ and https://<unused>.up.railway.app/ (404) both return them, with server: railway-hikari (2026-10-24). They pass through a proxying CDN, so they name Railway behind Cloudflare too.
    notes: "Railway runs the customer's containers; the customer chooses and updates PHP. Sites proxied through Cloudflare show Cloudflare in DNS and are recognised by Railway's response headers."
    notes_ja: "Railwayは利用者のコンテナを動かす基盤で、PHPのバージョンは利用者が選んで更新する。Cloudflare経由で公開しているサイトはDNS上はCloudflareに見えるが、Railwayの応答ヘッダで判別できる。"
    news: https://blog.railway.com/rss.xml
    #   Checked 2026-10-26: the blog's feed; lists the cited report.
    incidents:
      php2shell:
        status: "n/a"
        confidence: secondary
        summary: "PaaS。PHPは利用者のコンテナで動き、利用者が更新する。Railwayのブログ（2026年10月24日時点）にphp2shellの告知はない。"
        summary_en: "PaaS. PHP runs in the customer's container and the customer updates it. Railway's blog had no php2shell notice as of 2026-10-24."
        customer_action: "PHPを使うサービスは、イメージやビルド設定のPHPを修正版（8.2.35 / 8.3.36 / 8.4.27 / 8.5.12 以降）に更新して再デプロイする。"
        customer_action_en: "For services that use PHP, update PHP in the image or build settings to a fixed release (8.2.35 / 8.3.36 / 8.4.27 / 8.5.12 or later) and redeploy."
        verified_at: "2026-10-24"
      railway-2026-10:
        title: "2026年10月のセキュリティ事故（環境変数の漏えい）"
        title_en: "October 2026 security incident (environment variables exposed)"
        status: "in_progress"
        confidence: official
        date: "2026-10-26"
        summary: "公式の暫定報告（10月22日公開、26日まで追記）：10月20日13:58〜22日03:32（UTC）、攻撃者がRailwayの内部システムに侵入し、暗号化された環境変数を取得、その一部を復号した。環境変数が漏えいした可能性があるのは最大で全ワークスペースの1.85%（約10万件）だが、どの変数が復号されたかは特定できていない。攻撃者はAIサービスのAPIキーを狙っていた。稼働中のサービスは止まっておらず、ビルドとデプロイは10月23日までに全プランで再開。高リスクと判断した利用者への通知は10月23日18:57（UTC）に完了したが、通知が届いていないワークスペースも安全とは確認されていない。10月26日には「既存の利用者について事故は解決した」とし、新規登録は停止したまま今週中に再開予定。漏えいしたAPIキーで他社サービスに使われた料金はRailwayでは返金できないとしている。"
        summary_en: "Official preliminary report (Oct 22, updated through Oct 26): from Oct 20 13:58 to Oct 22 03:32 UTC an attacker was inside Railway's internal systems, pulled encrypted environment variables and decrypted some of them. At most 1.85% of workspaces (about 100,000) may have had variables exposed, but which variables were decrypted cannot be determined. The attacker was after AI provider API keys. Running services stayed up; builds and deploys were back on every plan by Oct 23. Notices to workspaces judged high-risk were completed at 18:57 UTC on Oct 23; workspaces without a notice are not confirmed safe. On Oct 26 Railway said the incident is resolved for existing users; new signups stay paused and are to reopen this week. It says it cannot refund spend run up on other platforms with the stolen API keys."
        customer_action: "10月21日より前に登録したRailway利用者は、環境変数に保存したAPIキー・データベースのパスワード・レジストリ認証情報などを、提供元で失効させてから新しい値に入れ替えて再デプロイする（Railway上で値を変えるだけでは古い鍵は有効なまま）。データベースの公開ネットワークアクセスを外し、GitHubやAI・クラウドサービスの利用履歴に不審な操作がないか確認する。漏えいしたキーでAIサービスの料金が発生した場合は、まずそのAIサービスに連絡し、証拠を添えてRailwayのサポートにも申し出る。制作会社が運用している場合は、Railwayを使っているかと対応状況を確認する。"
        customer_action_en: "Railway customers who signed up before Oct 21: revoke the API keys, database passwords, registry credentials and other secrets stored in environment variables at their source, then set new values and redeploy (changing the value on Railway alone leaves the old key valid). Remove public network access to databases and check GitHub, AI and cloud provider activity for anything unusual. If stolen keys ran up AI charges, contact that AI provider first, then file a Railway support request with the evidence. If an agency runs the site, ask whether it uses Railway and what it has done."
        source: https://blog.railway.com/p/preliminary-report-october-security-incident
        verified_at: "2026-10-28"

