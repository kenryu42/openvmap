    notes_ja: "GoDaddyのネットワーク（AS26496・AS398101・AS398787）には、利用者がPHPを管理するVPS・専用サーバーや、ドメイン転送用のサーバー（redirect-*.secureserver.net）も含まれ、DNSだけではWeb HostingやManaged WordPressと区別できない。GoDaddyで登録したドメインは、サイトがどこにあってもGoDaddyのネームサーバー（*.domaincontrol.com、godaddy-dns 参照）を使うため、ネームサーバーだけではGoDaddyでホストされているとは言えない。"
