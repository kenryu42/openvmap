        status: "patched"
        confidence: official
        date: "2026-10-22"
        summary: "公式報告（10月22日 18:05）：PHP 8.2〜8.5 は開発元の修正版（8.2.35／8.3.36／8.4.27／8.5.12）を適用し、7.4／8.0／8.1 は開発元が提供したサポート終了版向けの修正を適用、5.6〜7.3 は公式の修正内容をもとに自社で作成・検証した修正を適用した。全バージョンで session.upload_progress を無効化。10月22日 3:05頃からサーバー単位でサイト表示を停止し、11:24頃に再開した。攻撃を狙ったとみられるアクセスの試みはあったが、不正アクセスや情報漏えいは現時点で確認されていない。旧バージョンは独自修正のため、表示上のバージョン番号が変わるかどうかは告知に記載がない。"
