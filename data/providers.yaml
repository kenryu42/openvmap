    notes_ja: "独自ドメインのネームサーバーは uns01／uns02.lolipop.jp。ムームードメインでは「ロリポップ！」を選ぶだけで設定される。ロリポップのWebサーバーのASは公表されていないが、利用者向けサーバーはGMOインターネットのAS7506にあり、同じネットワークの他のGMOサービスとはネームサーバーで区別する。"
    news: https://lolipop.jp/info/news/
    #   Checked 2026-10-26: lists the cited notice.
    incidents:
      php2shell:
        status: "patched"
        confidence: official
        date: "2026-10-22"
        summary: "公式報告（10月22日）：PHP 8.2〜8.5 は開発元の修正版（8.2.35／8.3.36／8.4.27／8.5.12）を適用し、7.4／8.0／8.1 は開発元が提供したサポート終了版向けの修正を適用、公式修正のない 5.3〜7.3 は公式の修正内容をもとに自社で作成した修正を適用した。全バージョンで session.upload_progress を無効化。修正適用のため10月22日 3:09頃から一部サーバーでサイト表示を停止し、13時頃に再開した。攻撃を狙ったとみられるアクセスの試みはあったが、不正アクセスや情報漏えいは現時点で確認されていない。旧バージョンは独自修正のため、表示上のバージョン番号が変わるかどうかは告知に記載がない。"
        summary_en: "Official report (Oct 22): PHP 8.2-8.5 updated to the upstream fixed releases (8.2.35/8.3.36/8.4.27/8.5.12); 7.4/8.0/8.1 received the upstream fix code for EOL branches; 5.3-7.3, which have no official fix, received Lolipop's own fix based on the upstream one. session.upload_progress is disabled on every version. Customer sites on some servers were taken offline from about 03:09 on Oct 22 and restored at about 13:00. Exploit attempts were seen, but no unauthorized access or data leak has been confirmed. Because the older branches were patched in place, the notice does not say whether their displayed version number changes."
        customer_action: "ユーザー専用ページのPHP設定から、ドメインごとにPHP 8.2以降へ切り替える（8.1以下への今回の対策は暫定的なもの）。WordPressは本体・PHP・プラグイン・テーマが最新で更新が続いているか確認し、再開後にサイト表示・問い合わせフォーム・ファイルアップロードが正しく動くか確かめる。"
        customer_action_en: "Switch each domain to PHP 8.2 or later on the user page; the fixes for 8.1 and older are temporary. Check that WordPress core, plugins and themes are current and still maintained, and test page display, contact forms and file uploads."
        source: https://lolipop.jp/info/news/8239/
        verified_at: "2026-10-24"

