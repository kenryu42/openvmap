  - id: xserver
    name: Xserver
    name_ja: エックスサーバー
    kind: hosting
    asns: [131965]            # XSERVER-AS, Xserver Inc. (PeeringDB, bgp.tools)
    as_name_contains: [XSERVER]
    ns_suffixes: [xserver.jp]  # ns1..ns5.xserver.jp (official manual)
    incidents:
      php2shell:
        status: patched
        confidence: official
        date: "2026-10-22"
        summary: >-
          公式発表（2026年10月22日）によると、PHP 8.2〜8.5 の修正パッチは
          10月22日 6:45、PHP 7.4〜8.1 は 12:00、PHP 5.6〜7.3 は 14:00 に
          対象の全サーバーへ適用完了。PHP 5.1〜5.5 は 10月23日 17:00 時点で
          対象サーバーの過半数に適用済み。公式修正版のない 8.1 以前には独自
          修正を適用。
        summary_en: >-
          Official notice (2026-10-22): fix applied to all servers for PHP
          8.2-8.5 by 06:45 on Oct 22, PHP 7.4-8.1 by 12:00, PHP 5.6-7.3 by
          14:00. PHP 5.1-5.5: majority of servers done as of Oct 23 17:00.
          Own patch applied to branches with no official fix.
        customer_action: >-
          サーバーパネル「PHP Ver.切替」で各ドメインのPHPバージョンを確認。
          8.1 以前で稼働しているサイトは、サポート対象の 8.3 または 8.4 への
          切替を検討（切替前にバックアップと動作確認）。
        customer_action_en: >-
          Check each domain's PHP version in the server panel. Sites on 8.1
          or older should plan a move to 8.3 or 8.4 after a backup and test.
        source: https://www.xserver.ne.jp/news_detail.php?view_id=19734
        verified_at: "2026-10-23"

