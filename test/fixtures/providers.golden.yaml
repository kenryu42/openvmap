# Provider table for vmap.
#
# One entry per hosting, cloud, CDN, DNS or mail provider, with how to
# recognise it from public DNS and BGP data, and its published response to
# the current incident.
#
# Rules for contributors:
#   - "confidence: official" only with a link to the provider's own page.
#   - "confidence: secondary" for press or third-party summaries. Say so in
#     the summary and link the summary you used.
#   - Never guess an ASN. Leave asns empty and use as_name_contains (matched
#     against the Team Cymru AS name) or ns_suffixes instead. A missing
#     identifier causes a missed match; a wrong one causes a wrong vendor.
#   - verified_at is the date you last read the source, not the source's date.
#
# Status values: patched | in_progress | unknown | conflicting | n/a
# Kinds: hosting (runs PHP for the customer) | cloud (customer runs PHP) |
#        cdn | dns | mail

incident: php2shell
incident_cves: [CVE-2026-109618, CVE-2026-109619]
updated_at: "2026-10-23"

providers:

